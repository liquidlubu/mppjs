name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: build & test (linux-x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Liberica NIK
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "liberica"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2

      - name: Build fat jar
        working-directory: java
        run: mvn -B -q -DskipTests package

      - name: Build native binary
        run: >-
          native-image
          -H:+UnlockExperimentalVMOptions
          --no-fallback
          -H:+AddAllCharsets
          -H:ConfigurationFileDirectories=.ni-config
          -H:Name=mpxj-convert
          -H:Path=bin
          -jar java/target/mpxj-convert.jar

      - name: Compile TS
        run: |
          npm install
          npm run build:ts

      - name: Clone MPXJ samples
        run: git clone --depth 1 https://github.com/joniles/mpxj /tmp/mpxj

      - name: Run tests
        env:
          # Test the binary this job just built, not a published sidecar pulled in by npm install.
          MPPJS_BINARY: ${{ github.workspace }}/bin/mpxj-convert
        run: bun test test/

      # The runner has a JDK (it just built with GraalVM), so it cannot catch a
      # binary that silently depends on one. 0.1.5 and 0.1.6 both shipped broken
      # for exactly that reason: MPXJ read Gantt presentation data, which loads
      # java.awt and dlopens libawt.so. Convert one file with nothing but the
      # binary, in a container with no JDK, and fail the build if it cannot.
      - name: Verify the binary runs without a JDK
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}/bin/mpxj-convert:/mpxj-convert:ro" \
            -v /tmp/mpxj/junit/data:/data:ro \
            debian:12-slim \
            /mpxj-convert /data/DurationTest9.mpp /tmp/out.xml
